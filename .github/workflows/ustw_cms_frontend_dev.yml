name: "[dev] Build and Deploy to Azure"

on:
  push:
    branches:
      - develop
      - fix-cicd
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Create .env file
      run: |
        echo "NODE_ENV=development" > .env
        echo "NEXT_PUBLIC_SOUNDON_API_TOKEN=${{ secrets.NEXT_PUBLIC_SOUNDON_API_TOKEN_DEV }}" >> .env
        echo "NEXT_PUBLIC_SOUNDON_PODCAST_ID=${{ secrets.NEXT_PUBLIC_SOUNDON_PODCAST_ID_DEV }}" >> .env
        echo "NEXT_PUBLIC_GRAPHQL_API_URL=${{ secrets.NEXT_PUBLIC_GRAPHQL_API_URL_DEV }}" >> .env
    
    - name: Log in to ACR
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.ACR_LOGIN_SERVER_DEV }}
        username: ${{ secrets.ACR_USERNAME_DEV }}
        password: ${{ secrets.ACR_PASSWORD_DEV }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.ACR_LOGIN_SERVER_DEV }}/ustw-cms-frontend-dev:${{ github.sha }}
    
    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'ustw-cms-frontend-dev'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_DEV }}
        images: '${{ secrets.ACR_LOGIN_SERVER_DEV }}/ustw-cms-frontend-dev:${{ github.sha }}'