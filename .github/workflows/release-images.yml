name: Release images
on:
  workflow_dispatch:
    inputs:
      component:
        description: Build and publish images only; this does not deploy
        type: choice
        options: [frontend, backend, both]
        default: frontend
        required: true
      backend_ref:
        description: Exact 40-character reviewed backend commit (required for backend/both)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: ustw-release-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Existing environment holds registry/build configuration. All domains are production.
    environment: Development
    env:
      COMPONENT: ${{ inputs.component }}
      BACKEND_REF: ${{ inputs.backend_ref }}
      REGISTRY: ustwcmsfrontenddev.azurecr.io
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate immutable backend source selection
        run: |
          if [[ "$COMPONENT" != frontend && ! "$BACKEND_REF" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'An exact reviewed backend commit is required.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        if: inputs.component != 'frontend'
        with:
          repository: US-Taiwan-Watch/backend
          ref: ${{ inputs.backend_ref }}
          path: backend-source
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Validate build credentials before work
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          SOUNDON_API_TOKEN: ${{ secrets.SOUNDON_API_TOKEN || secrets.NEXT_PUBLIC_SOUNDON_API_TOKEN }}
          NEXT_PUBLIC_ALGOLIA_SEARCH_KEY: ${{ secrets.NEXT_PUBLIC_ALGOLIA_SEARCH_KEY }}
        run: |
          test -n "$ACR_USERNAME" && test -n "$ACR_PASSWORD"
          if [[ "$COMPONENT" != backend ]]; then
            test -n "$SOUNDON_API_TOKEN" && test -n "$NEXT_PUBLIC_ALGOLIA_SEARCH_KEY"
          fi
      - uses: docker/login-action@v3
        with:
          registry: ustwcmsfrontenddev.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build frontend standalone artifacts
        if: inputs.component != 'backend'
        env:
          SOUNDON_API_TOKEN: ${{ secrets.SOUNDON_API_TOKEN || secrets.NEXT_PUBLIC_SOUNDON_API_TOKEN }}
          NEXT_PUBLIC_ALGOLIA_SEARCH_KEY: ${{ secrets.NEXT_PUBLIC_ALGOLIA_SEARCH_KEY }}
          NEXT_PUBLIC_GOOGLE_TAG_MANAGER_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_TAG_MANAGER_ID }}
        run: |
          node deployment/scripts/write-build-config.mjs "$RUNNER_TEMP/website-build.json"
          trap 'rm -f "$RUNNER_TEMP/website-build.json"' EXIT
          docker buildx build --platform linux/amd64 --file deployment/Dockerfile.build \
            --secret "id=website-build.json,src=$RUNNER_TEMP/website-build.json" \
            --output "type=local,dest=$RUNNER_TEMP/website-artifacts" .
          cp deployment/Dockerfile.runtime "$RUNNER_TEMP/website-artifacts/Dockerfile"
          cp deployment/start-production.mjs "$RUNNER_TEMP/website-artifacts/start-production.mjs"
      - name: Publish frontend image with source-specific immutable tag
        id: frontend
        if: inputs.component != 'backend'
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/website-artifacts
          platforms: linux/amd64
          push: true
          tags: ustwcmsfrontenddev.azurecr.io/ustw-cms-frontend-dev:git-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish backend image with source-specific immutable tag
        id: backend
        if: inputs.component != 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: backend-source/payload3
          platforms: linux/amd64
          push: true
          tags: ustwcmsfrontenddev.azurecr.io/ustw-cms-backend:git-${{ inputs.backend_ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.revision=${{ inputs.backend_ref }}
      - name: Save non-secret release receipt
        env:
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const receipt = { frontendCommit: process.env.GITHUB_SHA, backendCommit: process.env.BACKEND_REF, frontendDigest: process.env.FRONTEND_DIGEST, backendDigest: process.env.BACKEND_DIGEST, deployed: false }
          fs.writeFileSync('release-images.json', JSON.stringify(receipt, null, 2) + '\n')
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Images published; production unchanged.\n\n```json\n' + JSON.stringify(receipt, null, 2) + '\n```\n')
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: release-images-${{ github.run_id }}
          path: release-images.json
      - name: Remove build configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/website-build.json"
